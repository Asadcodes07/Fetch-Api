
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Directory</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <p class="subtitle">STUDENT MANAGEMENT</p>

            <h1>Student Directory</h1>

            <p class="description">
                Find and explore student information.
            </p>
        </header>

        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput144"
                placeholder="Search students by name..."
                autocomplete="off"
            >

            <p id="resultCount145" class="result-count">
                Loading students...
            </p>

        </section>

        <!-- Loading Message -->
        <p id="loadingMessage142" class="loading">
            Loading students...
        </p>

        <!-- Error Message -->
        <div class="error-container">
            <p id="errorMessage143" class="error"></p>

            <button id="retryButton146" class="retry-btn" hidden>
                Try Again
            </button>
        </div>

        <!-- Student Cards -->
        <section
            id="studentList141"
            class="student-list"
        >
        </section>

    </main>

</body>
</html>
